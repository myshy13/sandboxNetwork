name: Build

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: sandboxNetwork-${{ runner.os }}
          path: |
            build/sandboxNetwork
            build/assets

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: sandboxNetwork-web
          path: |
            build-web/sandboxNetwork.html
            build-web/sandboxNetwork.js
            build-web/sandboxNetwork.wasm
            build-web/sandboxNetwork.data