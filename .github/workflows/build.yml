name: Build

# Only runs when a version tag is pushed (git tag v0.5.0 && git push origin v0.5.0),
# or by hand from the Actions tab. Never on ordinary pushes or PRs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux,   client: "Client/build/sandboxNetwork Client/build/assets", server: Server/build/sandboxNetworkServer }
          - { os: macos-latest,   name: macos,   client: Client/build/*.app,             server: Server/build/sandboxNetworkServer }
          - { os: windows-latest, name: windows, client: Client/build/Release,           server: Server/build/Release }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # raylib needs X11/GL headers on Linux
      - name: Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      # env.hpp is git-ignored, so CI starts from the template
      - name: Create env.hpp
        shell: bash
        run: cp Client/src/env.example.hpp Client/src/env.hpp

      - name: Build client
        run: |
          cmake -S Client -B Client/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Client/build --config Release

      - name: Build server
        run: |
          cmake -S Server -B Server/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Server/build --config Release

      # tar keeps the executable bit, which upload-artifact's zip drops
      - name: Package (Linux/macOS)
        if: matrix.name != 'windows'
        run: |
          mkdir dist
          tar -czf dist/client-${{ matrix.name }}.tar.gz ${{ matrix.client }}
          tar -czf dist/server-${{ matrix.name }}.tar.gz ${{ matrix.server }}

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p dist/client-windows dist/server-windows
          cp -r ${{ matrix.client }}/. dist/client-windows/
          cp -r ${{ matrix.server }}/. dist/server-windows/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist

  # Only tag pushes publish; a manual run just leaves the artifacts.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Zip Windows folders
        run: |
          cd dist
          for d in client-windows server-windows; do zip -r "$d.zip" "$d"; rm -r "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
