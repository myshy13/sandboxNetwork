name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Lets build.yml run these tests before a release
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # raylib's CMake needs X11/GL headers to configure, even though we never build it
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      # Keeps fetched deps between runs; busts when any CMakeLists changes
      - uses: actions/cache@v4
        with:
          path: Client/build
          key: test-deps-${{ hashFiles('**/CMakeLists.txt') }}

      # Tests only need the fetched cereal/raylib headers, not a built client
      - name: Fetch dependencies (Client)
        run: cmake -S Client -B Client/build

      - name: Fetch dependencies (Server)
        run: cmake -S Server -B Server/build

      # env.hpp is git-ignored, so CI starts from the template (as build.yml does)
      - name: Create env.hpp
        run: cp Client/src/env.example.hpp Client/src/env.hpp

      - name: Shared/Protocol tests
        run: cd Shared/Protocol && make test

      - name: Client/Protocol tests
        run: cd Client && make test

      - name: Server tests
        run: cd Server && make test